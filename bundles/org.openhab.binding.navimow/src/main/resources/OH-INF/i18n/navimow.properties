# add-on

addon.navimow.name = Navimow Binding
addon.navimow.description = Integrates Segway Navimow robotic lawn mowers via the Navimow cloud service. Supports real-time status updates and control commands.

# thing types

thing-type.navimow.bridge.label = Navimow Account
thing-type.navimow.bridge.description = Connects to the Navimow cloud service and manages MQTT real-time updates.
thing-type.navimow.mower.label = Navimow Mower
thing-type.navimow.mower.description = A Segway Navimow robotic lawn mower.

# thing types config

thing-type.config.navimow.bridge.apiBaseUrl.label = API Base URL
thing-type.config.navimow.bridge.apiBaseUrl.description = Override the Navimow API base URL. Leave empty to use the default.
thing-type.config.navimow.bridge.pollingInterval.label = Polling Interval
thing-type.config.navimow.bridge.pollingInterval.description = Interval in seconds for HTTP fallback polling. Set to 0 to disable polling (MQTT only).
thing-type.config.navimow.mower.deviceId.label = Device ID
thing-type.config.navimow.mower.deviceId.description = The unique device ID of the Navimow mower.

# channel types

channel-type.navimow.battery-level.label = Battery Level
channel-type.navimow.battery-level.description = Current battery level of the mower (percentage).
channel-type.navimow.current-mow-boundary.label = Current Mow Boundary
channel-type.navimow.current-mow-boundary.description = The boundary identifier where the mower is currently operating.
channel-type.navimow.current-mow-progress.label = Current Mow Progress
channel-type.navimow.current-mow-progress.description = The mowing progress within the current boundary.
channel-type.navimow.error-code.label = Error Code
channel-type.navimow.error-code.description = Error code reported by the mower, or "none" if there is no error.
channel-type.navimow.mow-start-type.label = Mow Start Type
channel-type.navimow.mow-start-type.description = Mowing start type indicator from the location telemetry stream (format to be determined).
channel-type.navimow.mower-command.label = Command
channel-type.navimow.mower-command.description = Send a command to the mower.
channel-type.navimow.mower-command.state.option.start = Start Mowing
channel-type.navimow.mower-command.state.option.stop = Stop Mowing
channel-type.navimow.mower-command.state.option.pause = Pause
channel-type.navimow.mower-command.state.option.resume = Resume
channel-type.navimow.mower-command.state.option.dock = Return to Base
channel-type.navimow.mower-location.label = Location
channel-type.navimow.mower-location.description = Current GPS position of the mower (latitude, longitude).
channel-type.navimow.mower-status.label = Status
channel-type.navimow.mower-status.description = Current operational state of the mower.
channel-type.navimow.mower-status.state.option.idle = Idle
channel-type.navimow.mower-status.state.option.mowing = Mowing
channel-type.navimow.mower-status.state.option.paused = Paused
channel-type.navimow.mower-status.state.option.docked = Docked
channel-type.navimow.mower-status.state.option.charging = Charging
channel-type.navimow.mower-status.state.option.returning = Returning to Base
channel-type.navimow.mower-status.state.option.error = Error
channel-type.navimow.mower-status.state.option.unknown = Unknown
channel-type.navimow.mowing-percentage.label = Mowing Percentage
channel-type.navimow.mowing-percentage.description = The overall mowing progress for the current task.
channel-type.navimow.mowing-week-area.label = Mowing Week Area
channel-type.navimow.mowing-week-area.description = Total area mowed this week.
channel-type.navimow.posture-theta.label = Posture Theta
channel-type.navimow.posture-theta.description = Mower's current heading angle.
channel-type.navimow.posture-x.label = Posture X
channel-type.navimow.posture-x.description = Mower's current X relative coordinate.
channel-type.navimow.posture-y.label = Posture Y
channel-type.navimow.posture-y.description = Mower's current Y relative coordinate.
channel-type.navimow.signal-strength.label = Signal Strength
channel-type.navimow.signal-strength.description = RSSI signal strength of the mower (dBm).
channel-type.navimow.subtotal-area.label = Subtotal Area
channel-type.navimow.subtotal-area.description = Current activity subtotal area.

